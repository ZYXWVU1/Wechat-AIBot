services:
  wechat-ai-backend:
    build:
      context: .
    container_name: wechat-ai-backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - bot-data:/data
      - ./config:/config:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  bot-data:
    name: wechat-ai-data

